  { id: "seguros",         label: "Seguros (Juan)",    emoji: "🛡️" },
  { id: "trading",         label: "Trading",           emoji: "📈" },
  { id: "devolucion",      label: "Devolución",        emoji: "↩️" },
  { id: "banda_ingreso",   label: "Devolución Banda",  emoji: "🎸" },
  { id: "inversiones_rdo", label: "Rdto. Inversiones", emoji: "💰" },
  { id: "otro_ingreso",    label: "Otro",              emoji: "➕" },
];

const MEDIOS = ["Efectivo", "Visa", "Mastercard", "MercadoPago", "Carrefour"];
const MEDIO_COLORS = {
  "Efectivo":    "#4ade80",
  "Visa":        "#60a5fa",
  "Mastercard":  "#f97316",
  "MercadoPago": "#818cf8",
  "Carrefour":   "#fb7185",
};

// ── HELPERS
const todayStr     = () => new Date().toISOString().slice(0,10);
const yesterdayStr = () => { const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); };
const fmtDate      = (iso) => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtMoney     = (n) => "$"+Number(n).toLocaleString("es-AR",{minimumFractionDigits:0});
const monthKey     = (iso) => iso?.slice(0,7);
const currentMonth = () => todayStr().slice(0,7);
const addMonths    = (ym,n) => { const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const MONTH_NAMES  = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const fmtMonth     = (ym) => { if(!ym) return ""; const [y,m]=ym.split("-"); return `${MONTH_NAMES[parseInt(m)-1]} ${y}`; };
const getCat       = (id) => EXPENSE_CATS.find(c=>c.id===id);
const getCuotasForMonth = (cuotas,ym) => cuotas.flatMap(c => {
  const res=[];
  for(let i=0;i<c.totalCuotas;i++) if(addMonths(c.startMonth,i)===ym) res.push({...c,cuotaNum:i+1,amount:Math.round(c.totalAmount/c.totalCuotas),type:"expense",isCuota:true});
  return res;
});

// ── APP
function App() {
  const [view,setView]                   = useState("home");
  const [transactions,setTransactions]   = useState([]);
  const [cuotas,setCuotas]               = useState([]);
  const [lisandroData,setLisandroData]   = useState({});
  const [selMonth,setSelMonth]           = useState(currentMonth());

  useEffect(()=>{
    (async()=>{
      try {
        const r1 = await window.storage.get(KEY_TX);
        if(r1?.value) {
          const stored = JSON.parse(r1.value);
          const newTxs = stored.filter(t=>t.id>1700000000500);
          setTransactions([...SEED_DATA,...newTxs]);
        } else {
          setTransactions(SEED_DATA);
        }
        const r2 = await window.storage.get(KEY_CUOTAS);
        if(r2?.value) setCuotas(JSON.parse(r2.value));
        const r3 = await window.storage.get(KEY_LISANDRO);
        if(r3?.value) setLisandroData(JSON.parse(r3.value));
      } catch(_) { setTransactions(SEED_DATA); }
    })();
  },[]);

  const saveTx = useCallback(async(txs)=>{
    setTransactions(txs);
    const newTxs = txs.filter(t=>t.id>1700000000500);
    try { await window.storage.set(KEY_TX,JSON.stringify(newTxs)); } catch(_) {}
  },[]);
  const saveCuotas = useCallback(async(cs)=>{
    setCuotas(cs);
    try { await window.storage.set(KEY_CUOTAS,JSON.stringify(cs)); } catch(_) {}
  },[]);
  const saveLisandro = useCallback(async(data)=>{
    setLisandroData(data);
    try { await window.storage.set(KEY_LISANDRO,JSON.stringify(data)); } catch(_) {}
  },[]);

  const addTx      = useCallback((tx)=>saveTx([...transactions,{...tx,id:Date.now()}]),[transactions,saveTx]);
  const deleteTx   = useCallback((id)=>saveTx(transactions.filter(t=>t.id!==id)),[transactions,saveTx]);
  const addCuota   = useCallback((c)=>saveCuotas([...cuotas,{...c,id:Date.now()}]),[cuotas,saveCuotas]);
  const deleteCuota= useCallback((id)=>saveCuotas(cuotas.filter(c=>c.id!==id)),[cuotas,saveCuotas]);

  const allMonths = [...new Set([
    ...transactions.map(t=>monthKey(t.date)),
    ...cuotas.flatMap(c=>Array.from({length:c.totalCuotas},(_,i)=>addMonths(c.startMonth,i)))
  ])].filter(Boolean).sort().reverse();
  if(!allMonths.includes(currentMonth())) allMonths.unshift(currentMonth());

  const monthTxs    = transactions.filter(t=>monthKey(t.date)===selMonth);
  const monthCuotas = getCuotasForMonth(cuotas,selMonth);
  const totalIncome  = monthTxs.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const totalCuotas  = monthCuotas.reduce((s,c)=>s+c.amount,0);
  const totalExpense = monthTxs.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0)+totalCuotas;
  const balance      = totalIncome-totalExpense;
  const impuestosTotal = monthTxs.filter(t=>t.type==="expense"&&t.category==="impuestos").reduce((s,t)=>s+t.amount,0);

  const catBreakdown = EXPENSE_CATS.map(c=>{
    const fromTx     = monthTxs.filter(t=>t.type==="expense"&&t.category===c.id).reduce((s,t)=>s+t.amount,0);
    const fromCuotas = monthCuotas.filter(q=>q.category===c.id).reduce((s,q)=>s+q.amount,0);
    return {...c,total:fromTx+fromCuotas,fromCuotas};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);

  const props = {setView,balance,totalExpense,totalIncome,totalCuotas,monthTxs,monthCuotas,selMonth,setSelMonth,months:allMonths,catBreakdown,deleteTx,cuotas,deleteCuota,lisandroData,saveLisandro,impuestosTotal};

  return (
    <div style={fontFamily:"'DM Sans',sans-serif",background:"#0f0f0f",minHeight:"100vh",maxWidth:430,margin:"0 auto",color:"#f1f5f9"}>
      {view==="home"       && <HomeView       {...props}/>}
      {view==="addExpense" && <AddExpenseView onSave={addTx}    onBack={()=>setView("home")}/>}
      {view==="addIncome"  && <AddIncomeView  onSave={addTx}    onBack={()=>setView("home")}/>}
      {view==="addCuota"   && <AddCuotaView   onSave={addCuota} onBack={()=>setView("home")}/>}
    </div>
  );
}

function HomeView({setView,balance,totalExpense,totalIncome,totalCuotas,monthTxs,monthCuotas,selMonth,setSelMonth,months,catBreakdown,deleteTx,cuotas,deleteCuota,lisandroData,saveLisandro,impuestosTotal}) {
  const [tab,setTab] = useState("resumen");
  const allMovements = [
    ...monthTxs.map(t=>{...t,isCuota:false}),
    ...monthCuotas.map(c=>{...c,date:selMonth+"-01",type:"expense"}),
  ].sort((a,b)=>(b.id||0)-(a.id||0));
  const activeCuotas = cuotas.filter(c=>addMonths(c.startMonth,c.totalCuotas-1)>=currentMonth());

  return (
    <div style={minHeight:"100vh",display:"flex",flexDirection:"column",background:"#0f0f0f"}>
      <div style={background:"linear-gradient(160deg,#1a1a2e 0%,#16213e 100%)",padding:"20px 16px 16px",borderBottom:"1px solid #1e293b"}>
        <div style={display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}>
          <span style={fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800,letterSpacing:"-0.5px"}>💸 Gastos Manno</span>
          <select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:8,padding:"6px 10px",fontSize:13,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}>
            {months.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}
          </select>
        </div>
        <div style={background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"16px 20px",border:"1px solid rgba(255,255,255,0.08)"}>
          <div style={fontSize:12,color:"#64748b",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.5px"}>Balance del mes</div>
          <div style={fontFamily:"'Syne',sans-serif",fontSize:36,fontWeight:800,letterSpacing:"-1px",marginBottom:10,color:balance>=0?"#4ade80":"#f87171"}>{fmtMoney(balance)}</div>
          <div style={display:"flex",gap:8,flexWrap:"wrap"}>
            <span style={background:"rgba(74,222,128,0.12)",color:"#4ade80",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:600}>▲ {fmtMoney(totalIncome)}</span>
            <span style={background:"rgba(248,113,113,0.12)",color:"#f87171",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:600}>▼ {fmtMoney(totalExpense)}</span>
            {totalCuotas>0 && <span style={background:"rgba(129,140,248,0.15)",color:"#a5b4fc",borderRadius:20,padding:"4px 12px",fontSize:12,fontWeight:600}>🔁 {fmtMoney(totalCuotas)} cuotas</span>}
          </div>
        </div>
      </div>

      <div style={display:"flex",gap:10,padding:"12px 16px",background:"#0f0f0f"}>
        <button style={flex:1,padding:"13px 6px",borderRadius:14,border:"none",fontSize:13,fontWeight:700,fontFamily:"'Syne',sans-serif",cursor:"pointer",background:"#f87171"} onClick={()=>setView("addExpense")}>− Gasto</button>
        <button style={flex:1,padding:"13px 6px",borderRadius:14,border:"none",fontSize:13,fontWeight:700,fontFamily:"'Syne',sans-serif",cursor:"pointer",background:"#4ade80",color:"#111"} onClick={()=>setView("addIncome")}>+ Ingreso</button>
        <button style={flex:1,padding:"13px 6px",borderRadius:14,border:"none",fontSize:13,fontWeight:700,fontFamily:"'Syne',sans-serif",cursor:"pointer",background:"#818cf8",color:"#111"} onClick={()=>setView("addCuota")}>🔁 Cuotas</button>
      </div>

      <div style={display:"flex",background:"#0f0f0f",padding:"0 16px",borderBottom:"1px solid #1e293b"}>
        {["resumen","movimientos","cuotas"].map(t=>(
          <button key={t} style={flex:1,padding:"12px 4px",background:"transparent",border:"none",color:tab===t?"#f1f5f9":"#64748b",fontSize:13,fontWeight:600,cursor:"pointer",borderBottom:tab===t?"2px solid #6366f1":"2px solid transparent"} onClick={()=>setTab(t)}>
            {t==="resumen"?"Resumen":t==="movimientos"?"Movimientos":"Mis Cuotas"}
          </button>
        ))}
      </div>

      <div style={flex:1,overflowY:"auto",padding:"8px 16px 80px"}>
        {tab==="resumen"     && <ResumenPanel catBreakdown={catBreakdown} totalExpense={totalExpense} monthTxs={monthTxs} monthCuotas={monthCuotas} lisandroData={lisandroData} saveLisandro={saveLisandro} selMonth={selMonth} impuestosTotal={impuestosTotal}/>}
        {tab==="movimientos" && <MovimientosPanel allMovements={allMovements} deleteTx={deleteTx}/>}
        {tab==="cuotas"      && <CuotasPanel cuotas={cuotas} activeCuotas={activeCuotas} onDelete={deleteCuota}/>}
      </div>
    </div>
  );
}

function ResumenPanel({catBreakdown,totalExpense,monthTxs,monthCuotas,lisandroData,saveLisandro,selMonth,impuestosTotal}) {
  const lisandroMonto  = lisandroData[selMonth]?.monto||0;
  const totalCompartido= impuestosTotal+lisandroMonto;
  const miParte        = Math.round(totalCompartido/2);
  const leMeDebe       = impuestosTotal-miParte;

  const allExpenses = [
    ...monthTxs.filter(t=>t.type==="expense"),
    ...monthCuotas.map(c=>{...c,medio:c.medio||"Otros"})
  ];
  const medioTotals = {};
  allExpenses.forEach(t=>{ const m=t.medio||"Efectivo"; medioTotals[m]=(medioTotals[m]||0)+t.amount; });
  const medios = Object.entries(medioTotals).sort((a,b)=>b[1]-a[1]);

  return (
    <div>
      {catBreakdown.length===0 && <div style={color:"#475569",textAlign:"center",padding:"40px 0",fontSize:14}>Sin gastos este mes todavía</div>}
      {catBreakdown.map(c=><CatRow key={c.id} cat={c} total={totalExpense}/>)}

      {medios.length>0 && <>
        <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginTop:24,marginBottom:4,paddingTop:16,borderTop:"1px solid #1e293b"}>Gasto por tarjeta / medio</div>
        <div style={fontSize:11,color:"#475569",marginBottom:12}>Incluye impuestos y cargos de cada tarjeta</div>
        {medios.map(([medio,total])=>(
          <div key={medio} style={padding:"12px 0",borderBottom:"1px solid #1e293b"}>
            <div style={display:"flex",alignItems:"center",gap:8,marginBottom:4}>
              <div style={width:10,height:10,borderRadius:"50%",flexShrink:0,background:MEDIO_COLORS[medio]||"#94a3b8"}/>
              <span style={fontSize:14,color:"#cbd5e1",fontWeight:500}>{medio}</span>
            </div>
            <div style={display:"flex",justifyContent:"space-between",marginBottom:6}>
              <span style={fontSize:15,fontWeight:700,color:"#f1f5f9"}>{fmtMoney(total)}</span>
              <span style={fontSize:13,color:"#64748b"}>{totalExpense>0?Math.round(total/totalExpense*100):0}%</span>
            </div>
            <div style={height:4,background:"#1e293b",borderRadius:4,overflow:"hidden"}>
              <div style={height:"100%",borderRadius:4,width:`${totalExpense>0?Math.round(total/totalExpense*100):0}%`,background:MEDIO_COLORS[medio]||"#94a3b8"}/>
            </div>
          </div>
        ))}
      </>}

      <div style={marginTop:24,background:"#0f172a",border:"1px solid #1e3a5f",borderRadius:16,padding:"16px",borderTop:"2px solid #1e40af"}>
        <div style={fontSize:13,fontWeight:700,color:"#60a5fa",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:14}>🤝 Compartido con Lisandro</div>
        <div style={display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}>
          <span style={fontSize:14,color:"#94a3b8"}>Pagué yo (Impuestos)</span>
          <span style={fontSize:15,fontWeight:600,color:"#e2e8f0"}>{fmtMoney(impuestosTotal)}</span>
        </div>
        <div style={display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}>
          <span style={fontSize:14,color:"#94a3b8"}>Pagó Lisandro</span>
          <div style={display:"flex",alignItems:"center",gap:4,background:"#1e293b",borderRadius:8,padding:"6px 10px",border:"1px solid #334155"}>
            <span style={color:"#64748b",fontSize:14}>$</span>
            <input type="number" inputMode="numeric" value={lisandroMonto||""} onChange={e=>saveLisandro({...lisandroData,[selMonth]:{monto:parseInt(e.target.value)||0}})} placeholder="0" style={background:"transparent",border:"none",color:"#f1f5f9",fontSize:15,fontWeight:600,width:110,outline:"none",textAlign:"right",fontFamily:"'DM Sans',sans-serif"}/>
          </div>
        </div>
        {totalCompartido>0 && <>
          <div style={height:1,background:"#1e3a5f",margin:"10px 0"}/>
          <div style={display:"flex",justifyContent:"space-between",marginBottom:8}>
            <span style={fontSize:14,color:"#94a3b8"}>Total compartido</span>
            <span style={fontSize:15,fontWeight:600,color:"#e2e8f0"}>{fmtMoney(totalCompartido)}</span>
          </div>
          <div style={display:"flex",justifyContent:"space-between",marginBottom:8}>
            <span style={fontSize:14,color:"#94a3b8"}>Mi parte (50%)</span>
            <span style={fontSize:15,fontWeight:600,color:"#e2e8f0"}>{fmtMoney(miParte)}</span>
          </div>

function TxRow({tx,onDelete}) {
  const [confirm,setConfirm] = useState(false);

  const label = tx.isCuota?`${tx.detail||cat?.label} (${tx.cuotaNum}/${tx.totalCuotas})`:(tx.detail||cat?.label||tx.category);
  return (
    <div style={display:"flex",alignItems:"center",gap:10,padding:"12px 0",borderBottom:"1px solid #1a1a2e"}>
      <span style={fontSize:22,width:32,textAlign:"center"}>{tx.isCuota?"🔁":cat?.emoji||"💸"}</span>
      <div style={flex:1,minWidth:0}>
        <span style={display:"block",fontSize:14,fontWeight:500,color:"#e2e8f0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}>{label}</span>
        <span style={display:"block",fontSize:12,color:"#475569",marginTop:2}>{fmtDate(tx.date)}{tx.medio?` · ${tx.medio}`:""}</span>
      </div>
      <div style={display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}>

function CuotasPanel({cuotas,activeCuotas,onDelete}) {
  const [confirm,setConfirm] = useState(null);
  const totalMensual = activeCuotas.reduce((s,c)=>s+Math.round(c.totalAmount/c.totalCuotas),0);
  return (
    <div>
      {cuotas.length===0&&<div style={color:"#475569",textAlign:"center",padding:"40px 0",fontSize:14}>No hay cuotas registradas</div>}
      {activeCuotas.length>0&&<div style={background:"linear-gradient(135deg,#1e1b4b,#312e81)",borderRadius:14,padding:"16px",marginBottom:16,textAlign:"center"}>
        <div style={fontSize:12,color:"#a5b4fc",marginBottom:4}>Compromiso mensual en cuotas</div>
        <div style={fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:"#e0e7ff",marginBottom:4}>{fmtMoney(totalMensual)}/mes</div>
        <div style={fontSize:12,color:"#a5b4fc"}>{activeCuotas.length} compras activas</div>
      </div>}
      {cuotas.map(c=>{
        const cat=getCat(c.category);
        const cuotaAmt=Math.round(c.totalAmount/c.totalCuotas);
        const lastMonth=addMonths(c.startMonth,c.totalCuotas-1);
        const isActive=lastMonth>=currentMonth();
        let paidCount=0;
        for(let i=0;i<c.totalCuotas;i++) if(addMonths(c.startMonth,i)<currentMonth()) paidCount++;
        return (
          <div key={c.id} style={background:"#13131f",border:"1px solid #1e293b",borderRadius:14,padding:"14px",marginBottom:10,display:"flex",flexDirection:"column",gap:8,opacity:isActive?1:0.5}>
            <div style={display:"flex",alignItems:"center",gap:10}>
              <span style={fontSize:22,width:32,textAlign:"center"}>{cat?.emoji||"🔁"}</span>
              <div style={flex:1,minWidth:0}>
                <span style={display:"block",fontSize:14,fontWeight:500,color:"#e2e8f0"}>{c.detail||cat?.label}</span>
                <span style={display:"block",fontSize:12,color:"#475569",marginTop:2}>{cat?.label} · {c.medio}</span>
              </div>
              <div style={display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}>
                <span style={fontSize:14,fontWeight:700,color:"#f87171"}>{fmtMoney(cuotaAmt)}/mes</span>
                <span style={fontSize:11,color:"#64748b"}>{fmtMoney(c.totalAmount)} total</span>
              </div>
            </div>
            <div>
              <div style={display:"flex",justifyContent:"space-between",marginBottom:6}>
                <span style={fontSize:12,color:"#94a3b8"}>{paidCount}/{c.totalCuotas} cuotas</span>
                <span style={fontSize:12,color:"#64748b"}>hasta {fmtMonth(lastMonth)}</span>
              </div>
              <div style={height:4,background:"#1e293b",borderRadius:4,overflow:"hidden"}>
                <div style={height:"100%",borderRadius:4,width:`${Math.round(paidCount/c.totalCuotas*100)}%`,background:cat?.color||"#6366f1"}/>
              </div>
            </div>
            {confirm===c.id?<div style={display:"flex",alignItems:"center",gap:8,marginTop:4}>
              <span style={fontSize:12,color:"#f87171"}>¿Eliminás la compra completa?</span>
              <button style={background:"#7f1d1d",border:"none",color:"#fca5a5",fontSize:11,fontWeight:600,borderRadius:6,padding:"3px 7px",cursor:"pointer"} onClick={()=>{onDelete(c.id);setConfirm(null);}}>Sí, borrar</button>
              <button style={background:"transparent",border:"none",fontSize:12,cursor:"pointer",color:"#475569"} onClick={()=>setConfirm(null)}>Cancelar</button>
            </div>:<button style={background:"transparent",border:"none",fontSize:13,cursor:"pointer",color:"#475569",alignSelf:"flex-end",marginTop:4} onClick={()=>setConfirm(c.id)}>🗑 Eliminar</button>}
          </div>
        );
      })}
    </div>
  );
}

function AddExpenseView({onSave,onBack}) {
  const [cat,setCat]=[useState(null)].flat()[0], setCatFn=[useState(null)].flat()[1];
  const [_cat,_setCat]     = useState(null);
  const [amount,setAmount] = useState("");
  const [medio,setMedio]   = useState("Efectivo");
  const [detail,setDetail] = useState("");
  const [dateMode,setDateMode] = useState("today");
  const [customDate,setCustomDate] = useState(todayStr());
  const [saved,setSaved]   = useState(false);
  const getDate = () => dateMode==="today"?todayStr():dateMode==="yesterday"?yesterdayStr():customDate;
  const handleSave = () => {
    if(!_cat||!amount) return;
    onSave({type:"expense",category:_cat.id,amount:parseInt(amount),medio,detail,date:getDate()});
    setSaved(true);
    setTimeout(()=>{_setCat(null);setAmount("");setMedio("Efectivo");setDetail("");setSaved(false);},900);
  };
  return (
    <div style={minHeight:"100vh",display:"flex",flexDirection:"column",background:"#0f0f0f"}>
      <div style={background:"#1a0a1e",padding:"16px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #2d1b3d"}>
        <button style={background:"transparent",border:"none",color:"#94a3b8",fontSize:14,cursor:"pointer"} onClick={onBack}>← Volver</button>
        <span style={fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800}>Nuevo Gasto</span>
      </div>
      {saved&&<div style={background:"#14532d",color:"#4ade80",textAlign:"center",padding:"10px",fontSize:14,fontWeight:700}>✓ Guardado</div>}

        <FormDate dateMode={dateMode} setDateMode={setDateMode} customDate={customDate} setCustomDate={setCustomDate}/>
        <div style={marginBottom:24}>
          <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}>¿En qué?</div>
          <div style={display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}>
            {EXPENSE_CATS.map(c=>(
              <button key={c.id} style={padding:"10px 4px",background:_cat?.id===c.id?c.color+"33":"#1a1a2e",border:`1.5px solid ${_cat?.id===c.id?c.color:"#1e293b"}`,borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer",transform:_cat?.id===c.id?"scale(1.05)":"scale(1)"} onClick={()=>_setCat(c)}>
                <span style={fontSize:22}>{c.emoji}</span>
                <span style={fontSize:10,color:"#94a3b8",fontWeight:600,textAlign:"center",lineHeight:1.2}>{c.label}</span>
              </button>
            ))}
          </div>
        </div>
        <AmountInput amount={amount} setAmount={setAmount}/>
        <MedioInput medio={medio} setMedio={setMedio}/>
        <DetailInput detail={detail} setDetail={setDetail} placeholder="ej: Carrefour, Farmacia..."/>
        <button style={width:"100%",padding:"16px",background:!_cat||!amount?"#dc2626":"#dc2626",border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,fontFamily:"'Syne',sans-serif",cursor:"pointer",marginTop:8,opacity:!_cat||!amount?0.35:1} onClick={handleSave} disabled={!_cat||!amount}>Guardar gasto</button>
      </div>
    </div>
  );
}

function AddCuotaView({onSave,onBack}) {
  const [cat,setCat]             = useState(null);
  const [total,setTotal]         = useState("");
  const [numCuotas,setNumCuotas] = useState(3);
  const [medio,setMedio]         = useState("Visa");
  const [detail,setDetail]       = useState("");
  const [startMonth,setStartMonth] = useState(currentMonth());
  const [saved,setSaved]         = useState(false);
  const cuotaAmt = total&&numCuotas?Math.round(parseInt(total)/numCuotas):0;
  const handleSave = () => {
    if(!cat||!total) return;
    onSave({category:cat.id,totalAmount:parseInt(total),totalCuotas:numCuotas,medio,detail,startMonth});
    setSaved(true);
    setTimeout(()=>{setCat(null);setTotal("");setNumCuotas(3);setMedio("Visa");setDetail("");setSaved(false);},900);
  };
  const CUOTA_OPTS=[2,3,4,5,6,9,12,18,24];
  return (
    <div style={minHeight:"100vh",display:"flex",flexDirection:"column",background:"#0f0f0f"}>
      <div style={background:"#1e1b4b",padding:"16px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #312e81"}>
        <button style={background:"transparent",border:"none",color:"#94a3b8",fontSize:14,cursor:"pointer"} onClick={onBack}>← Volver</button>
        <span style={fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800}>Nueva Compra en Cuotas</span>
      </div>
      {saved&&<div style={background:"#3730a3",color:"#a5b4fc",textAlign:"center",padding:"10px",fontSize:14,fontWeight:700}>✓ Guardado</div>}
      <div style={flex:1,overflowY:"auto",padding:"16px 16px 80px"}>
        <div style={marginBottom:24}>
          <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}>¿En qué?</div>
          <div style={display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}>
            {EXPENSE_CATS.map(c=>(
              <button key={c.id} style={padding:"10px 4px",background:cat?.id===c.id?c.color+"33":"#1a1a2e",border:`1.5px solid ${cat?.id===c.id?c.color:"#1e293b"}`,borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer",transform:cat?.id===c.id?"scale(1.05)":"scale(1)"} onClick={()=>setCat(c)}>
                <span style={fontSize:22}>{c.emoji}</span>
                <span style={fontSize:10,color:"#94a3b8",fontWeight:600,textAlign:"center",lineHeight:1.2}>{c.label}</span>
              </button>
            ))}
          </div>
        </div>
        <div style={marginBottom:24}>
          <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}>Monto total de la compra</div>
          <div style={display:"flex",alignItems:"center",background:"#1e293b",borderRadius:14,border:"1px solid #334155",padding:"4px 16px"}>
            <span style={fontSize:28,color:"#475569",fontWeight:700,marginRight:8}>$</span>
            <input type="number" inputMode="numeric" placeholder="0" value={total} onChange={e=>setTotal(e.target.value)} style={flex:1,background:"transparent",border:"none",color:"#f1f5f9",fontSize:32,fontFamily:"'Syne',sans-serif",fontWeight:800,outline:"none",width:"100%"}/>
          </div>
        </div>
        <div style={marginBottom:24}>
          <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}>Cantidad de cuotas</div>
          <div style={display:"flex",flexWrap:"wrap",gap:8}>
            {CUOTA_OPTS.map(n=>(
              <button key={n} style={padding:"10px 16px",background:numCuotas===n?"#312e81":"#1e293b",border:`1px solid ${numCuotas===n?"#6366f1":"#334155"}`,borderRadius:10,color:numCuotas===n?"#a5b4fc":"#94a3b8",fontSize:14,fontWeight:700,cursor:"pointer"} onClick={()=>setNumCuotas(n)}>{n}x</button>
            ))}
          </div>
          {cuotaAmt>0&&<div style={marginTop:12,background:"rgba(99,102,241,0.1)",border:"1px solid #312e81",borderRadius:10,padding:"10px 14px",textAlign:"center"}>
            <span style={color:"#a5b4fc",fontWeight:700}>{fmtMoney(cuotaAmt)}/mes</span>
            <span style={color:"#64748b",fontSize:12}> durante {numCuotas} meses</span>
          </div>}
        </div>
        <div style={marginBottom:24}>
          <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}>Primera cuota en</div>
          <input type="month" value={startMonth} onChange={e=>setStartMonth(e.target.value)} style={width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:10,color:"#f1f5f9",padding:"10px 12px",fontSize:14,fontFamily:"'DM Sans',sans-serif"}/>
        </div>
        <MedioInput medio={medio} setMedio={setMedio}/>
        <DetailInput detail={detail} setDetail={setDetail} placeholder="ej: Zapatillas Mateo, TV Samsung..."/>
        <button style={width:"100%",padding:"16px",background:"#4f46e5",border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,fontFamily:"'Syne',sans-serif",cursor:"pointer",marginTop:8,opacity:!cat||!total?0.35:1} onClick={handleSave} disabled={!cat||!total}>Registrar cuotas</button>
      </div>
    </div>
  );
}

function FormDate({dateMode,setDateMode,customDate,setCustomDate}) {
  return (
    <div style={marginBottom:24}>
      <div style={fontSize:13,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10}>¿Cuándo?</div>
      <div style={display:"flex",gap:8}>
        {["today","yesterday","custom"].map(m=>(
          <button key={m} style={flex:1,padding:"10px 6px",background:dateMode===m?"#312e81":"#1e293b",border:`1px solid ${dateMode===m?"#6366f1":"#334155"}`,borderRadius:10,color:dateMode===m?"#a5b4fc":"#94a3b8",fontSize:13,fontWeight:600,cursor:"pointer"} onClick={()=>setDateMode(m)}>
            {m==="today"?"Hoy":m==="yesterday"?"Ayer":"Otra fecha"}
          </button>
        ))}
      </div>
      {dateMode==="custom"&&<input type="date" value={customDate} onChange={e=>setCustomDate(e.target.value)} style={marginTop:10,width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:10,color:"#f1f5f9",padding:"10px 12px",fontSize:14,fontFamily:"'DM Sans',sans-serif"}/>}
    </div>
  );
}

    </div>
  );
}
